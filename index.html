<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Vocab Log</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e1d8;--red:#d64545;--redbg:#fdecec;--green:#2e9e5b;--greenbg:#e8f6ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header,main{max-width:980px;margin:auto;padding:0 20px}
header{padding-top:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:24px}
.stats{display:flex;gap:18px;color:var(--muted);font-size:14px;flex-wrap:wrap;margin-top:8px}
.stats b{color:var(--ink)}
nav{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.active{color:var(--ink);border-color:var(--ink);font-weight:600}
main{padding-top:20px;padding-bottom:60px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
form.add{display:grid;grid-template-columns:1fr 2fr;gap:10px}
form.add .full{grid-column:1/-1}
@media(max-width:640px){form.add{grid-template-columns:1fr}}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:42px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wordrow{display:flex;gap:8px}
#lookupMsg{font-size:13px;color:var(--muted);min-height:16px}
.toolbar{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}
.toolbar select{width:auto}
.day{margin-top:18px}
.day h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.word{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.word.green{border-left-color:var(--green)}
.word .body{flex:1;min-width:0}
.word .w{font-weight:700;font-size:17px}
.word .m{margin-top:2px}
.word .ex{color:var(--muted);font-style:italic;font-size:14px;margin-top:4px}
.word .syn{font-size:13px;margin-top:4px}
.word .meta{font-size:12px;color:var(--muted);margin-top:6px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{cursor:pointer;border:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.pill.red{background:var(--redbg);color:var(--red)}
.pill.green{background:var(--greenbg);color:var(--green)}
.link{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;padding:0}
.link:hover{color:var(--ink);text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.flash{text-align:center;padding:36px 20px;margin-top:16px}
.prog{color:var(--muted);font-size:13px}
.fw{font-size:38px;font-weight:700;margin:18px 0}
#ans{margin:0 auto 20px;max-width:560px}
#ans .m{font-size:18px}
.actions{display:flex;gap:10px;justify-content:center}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:#faf9f5;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-weight:700;color:var(--red)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red)}
.dot.green{background:var(--green)}
.table-wrap{overflow-x:auto}
#importFile{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📚 GRE Vocab Log</h1>
    <div class="row">
      <button class="btn small" id="exportBtn">Export backup</button>
      <label class="btn small" for="importFile">Import</label>
      <input type="file" id="importFile" accept=".json">
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <nav>
    <button class="active" data-tab="words">Words</button>
    <button data-tab="revise">Revise</button>
    <button data-tab="errors">Error Log</button>
  </nav>
</header>

<main>
  <!-- WORDS -->
  <section class="panel active" id="words">
    <form class="add card" id="addForm" autocomplete="off">
      <div class="wordrow">
        <input name="word" placeholder="Word (e.g. laconic)" required>
        <button class="btn" type="button" id="lookupBtn" title="Fill meaning, example and synonyms from the dictionary">🔍 Look up</button>
      </div>
      <input name="meaning" placeholder="Meaning (auto-fills when you type a word)">
      <textarea class="full" name="example" placeholder="Example sentence (optional)"></textarea>
      <input class="full" name="synonyms" placeholder="Synonyms / related words (optional)">
      <div class="full" id="lookupMsg"></div>
      <div class="full row">
        <button class="btn primary" id="submitBtn" type="submit">Add word</button>
